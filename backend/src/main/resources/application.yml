spring:
  application:
    name: fincontrol
  ai:
    retry:
      max-attempts: 1
    model:
      chat: ${IA_PROVEDOR:none}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${IA_MODELO:qwen3.5:9b}
          temperature: 0.2
          num-ctx: ${IA_NUM_CTX:8192}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${IA_MODELO_ANTHROPIC:claude-sonnet-4-5}
          temperature: 0.2
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${IA_MODELO_OPENAI:gpt-4.1-mini}
          temperature: 0.2
  datasource:
    url: jdbc:mysql://localhost:3306/fincontrol
    username: ${DB_USERNAME:fincontrol_app}
    password: "${DB_PASSWORD:fin@2026}"
  flyway:
    user: ${FLYWAY_USER:fincontrol_migrate}
    password: "${FLYWAY_PASSWORD:migra@2026}"

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    persistAuthorization: true
    urls-primary-name: auth
    urls:
      - name: auth
        url: /contratos/auth.yaml
      - name: master
        url: /contratos/master.yaml
      - name: categorias
        url: /contratos/categorias.yaml
      - name: contas
        url: /contratos/contas.yaml
      - name: lancamentos
        url: /contratos/lancamentos.yaml
      - name: ofx
        url: /contratos/ofx.yaml
      - name: conciliacao
        url: /contratos/conciliacao.yaml
      - name: auditoria
        url: /contratos/auditoria.yaml
      - name: analise
        url: /contratos/analise.yaml
      - name: transferencias
        url: /contratos/transferencias.yaml
      - name: orcamentos
        url: /contratos/orcamentos.yaml
      - name: metas
        url: /contratos/metas.yaml
      - name: recorrencias
        url: /contratos/recorrencias.yaml

fincontrol:
  jwt:
    private-key-pem: ${JWT_PRIVATE_KEY_PEM:classpath:jwt/private.pem}
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:classpath:jwt/public.pem}
  cookie:
    secure: ${COOKIE_SECURE:true}
  seed:
    senha: ${SEED_SENHA:}
    usuario:
      nome: ${SEED_NOME_USUARIO:Voce}
      email: ${SEED_EMAIL_USUARIO:voce@fincontrol.local}
    mae:
      nome: ${SEED_NOME_MAE:Mae}
      email: ${SEED_EMAIL_MAE:mae@fincontrol.local}
    master:
      nome: ${SEED_NOME_MASTER:Master}
      email: ${SEED_EMAIL_MASTER:master@fincontrol.local}
    inativo:
      nome: ${SEED_NOME_INATIVO:Inativo}
      email: ${SEED_EMAIL_INATIVO:inativo@fincontrol.local}
    cliente-inativo:
      nome: ${SEED_NOME_CLIENTE_INATIVO:Cliente inativo}
      email: ${SEED_EMAIL_CLIENTE_INATIVO:cliente-inativo@fincontrol.local}
    leitor:
      nome: ${SEED_NOME_LEITOR:Leitor}
      email: ${SEED_EMAIL_LEITOR:leitor@fincontrol.local}
