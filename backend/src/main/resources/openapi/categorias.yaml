openapi: 3.0.3
info:
  title: FinControl Categorias
  version: 0.2.0
paths:
  /api/v1/categorias:
    get:
      operationId: listarCategorias
      tags: [categorias]
      security:
        - bearer: []
      responses:
        '200':
          description: Categorias do cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriaResponse'
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
    post:
      operationId: criarCategoria
      tags: [categorias]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponse'
        '400':
          description: Campo inválido
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '422':
          description: Nome já usado
  /api/v1/categorias/{id}:
    put:
      operationId: atualizarCategoria
      tags: [categorias]
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponse'
        '400':
          description: Campo inválido
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Não encontrada
        '422':
          description: Nome já usado
    delete:
      operationId: excluirCategoria
      tags: [categorias]
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Categoria excluída
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Não encontrada
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    CategoriaRequest:
      type: object
      required: [nome, natureza]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 80
        natureza:
          type: string
          enum: [RECEITA, DESPESA]
    CategoriaResponse:
      type: object
      required: [id, nome, natureza]
      properties:
        id:
          type: string
        nome:
          type: string
        natureza:
          type: string
          enum: [RECEITA, DESPESA]
